<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons - Helmies n8n Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Helmies n8n Assistant - Icon Generator</h1>
  <p>This will generate placeholder icons for the extension</p>
  <p style="color: #667eea; font-size: 14px;">Powered by <a href="https://helmies.fi" target="_blank">Helmies.fi</a></p>
  
  <div>
    <canvas id="icon16" width="16" height="16"></canvas>
    <canvas id="icon48" width="48" height="48"></canvas>
    <canvas id="icon128" width="128" height="128"></canvas>
  </div>
  
  <div>
    <button onclick="generateIcons()">Generate Icons</button>
    <button onclick="downloadAll()">Download All</button>
  </div>
  
  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Draw robot/AI symbol
      ctx.fillStyle = 'white';
      const centerX = size / 2;
      const centerY = size / 2;
      const headSize = size * 0.3;
      
      // Head (circle)
      ctx.beginPath();
      ctx.arc(centerX, centerY - size * 0.1, headSize, 0, Math.PI * 2);
      ctx.fill();
      
      // Body (rectangle)
      ctx.fillRect(
        centerX - headSize * 0.8,
        centerY + size * 0.1,
        headSize * 1.6,
        headSize * 0.8
      );
      
      // Eyes
      ctx.fillStyle = '#667eea';
      const eyeSize = headSize * 0.2;
      ctx.beginPath();
      ctx.arc(centerX - headSize * 0.4, centerY - size * 0.15, eyeSize, 0, Math.PI * 2);
      ctx.arc(centerX + headSize * 0.4, centerY - size * 0.15, eyeSize, 0, Math.PI * 2);
      ctx.fill();
    }
    
    function generateIcons() {
      const sizes = [16, 48, 128];
      sizes.forEach(size => {
        const canvas = document.getElementById(`icon${size}`);
        drawIcon(canvas, size);
      });
      alert('Icons generated! Click "Download All" to save them.');
    }
    
    function downloadCanvas(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    function downloadAll() {
      const sizes = [16, 48, 128];
      sizes.forEach(size => {
        const canvas = document.getElementById(`icon${size}`);
        downloadCanvas(canvas, `icon${size}.png`);
      });
      alert('Icons downloaded! Move them to the icons/ folder.');
    }
    
    // Generate on load
    window.onload = generateIcons;
  </script>
</body>
</html>
