<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helmies n8n Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      min-height: 500px;
      max-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    
    .settings-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .settings-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .status-bar {
      padding: 10px 15px;
      background: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
      font-size: 12px;
      color: #666;
    }
    
    .status-bar.connected {
      background: #d4edda;
      color: #155724;
    }
    
    .status-bar.disconnected {
      background: #f8d7da;
      color: #721c24;
    }
    
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #fff;
    }
    
    .message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      max-width: 85%;
      word-wrap: break-word;
    }
    
    .message.user {
      background: #667eea;
      color: white;
      margin-left: auto;
    }
    
    .message.assistant {
      background: #f1f3f5;
      color: #333;
    }
    
    .message.system {
      background: #fff3cd;
      color: #856404;
      max-width: 100%;
      font-size: 12px;
      text-align: center;
    }
    
    .message.confirmation {
      background: #cfe2ff;
      color: #084298;
      border: 1px solid #b6d4fe;
      max-width: 100%;
    }
    
    .confirmation-buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    
    .confirmation-buttons button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    
    .btn-approve {
      background: #28a745;
      color: white;
    }
    
    .btn-reject {
      background: #dc3545;
      color: white;
    }
    
    .input-container {
      padding: 15px;
      border-top: 1px solid #dee2e6;
      background: #f8f9fa;
    }
    
    .input-wrapper {
      display: flex;
      gap: 10px;
    }
    
    textarea {
      flex: 1;
      padding: 10px;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      resize: none;
      font-family: inherit;
      font-size: 14px;
    }
    
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .send-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    
    .send-btn:hover {
      background: #5568d3;
    }
    
    .send-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
      font-size: 12px;
      padding: 10px;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    
    .empty-state h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #666;
    }
    
    .empty-state p {
      font-size: 13px;
      line-height: 1.6;
    }
    
    pre {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Helmies n8n Assistant</h1>
    <div>
      <button class="settings-btn" id="newConversationBtn" style="margin-right: 5px;">🔄 New</button>
      <button class="settings-btn" id="settingsBtn">⚙️ Settings</button>
    </div>
  </div>
  
  <div class="status-bar" id="statusBar">
    Checking connection...
  </div>
  
  <div class="chat-container" id="chatContainer">
    <div class="empty-state">
      <h2>👋 Welcome to Helmies n8n Assistant!</h2>
      <p>I can help you with your n8n workflows. Try saying:</p>
      <p>
        • "Node 'Hello World' shows an error"<br>
        • "Add a Google Sheets node after Google Drive"<br>
        • "Complete the workflow after the Hello node"
      </p>
    </div>
  </div>
  
  <div class="input-container">
    <div class="input-wrapper">
      <textarea id="messageInput" rows="2" placeholder="Ask about your workflow..."></textarea>
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>
  
  <script src="storage-helper.js"></script>
  <script src="popup.js"></script>
</body>
</html>
